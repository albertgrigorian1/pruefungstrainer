<style>

  --pass:#6B1626; --on-pass:#F7EBCB;

  --sel:#6B1626; --sel-bg:#F7ECEE;

:root[data-theme="dark"]{
  --bg:#13151A; --surface:#1D2027; --ink:#ECEEF2; --muted:#A7AEBC; --line:#383D49; --soft:#2A2E38;

  --btn:#D2AC55; --on-btn:#1C1606;
  --sel:#E6A0AE; --sel-bg:#2E1D22;
  --good:#5CCB98; --good-bg:#14332A; --bad:#F39470; --bad-bg:#3B2018; --note-bg:#352D15;
  --flag:#C8102E; --flag-w:#EDEDED; color-scheme:dark }

html.big{font-size:118.75%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.wrap{max-width:42rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}

/* band */
.pass{background:var(--pass);color:var(--on-pass)}
.passin{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.9rem}
.passin>div{flex:1 1 0;min-width:0}
.pk,.pt{overflow-wrap:anywhere}
.pk{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.pt{font-family:var(--f-disp);font-weight:600;font-size:1.3rem;line-height:1.2}
.hbtn{background:transparent;border:1.5px solid var(--on-pass);color:var(--on-pass);border-radius:999px;padding:.45rem .9rem;min-height:2.6rem;cursor:pointer;white-space:nowrap;flex:none}
.flag i{display:block;height:3px;background:var(--flag)}
.flag i:nth-child(2){background:var(--flag-w)}

main{display:flex;flex-direction:column;gap:1.5rem;padding-block:1.5rem 3rem;overflow-wrap:break-word}
main h1{font-family:var(--f-disp);font-weight:600;font-size:1.7rem;line-height:1.2;text-wrap:balance}
main h2{font-family:var(--f-disp);font-weight:600;font-size:1.25rem;line-height:1.25;text-wrap:balance}
main h3{font-size:1rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:.75rem}
.stack.lg{gap:1.1rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.row>.grow{flex:1 1 12rem;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;padding:.7rem 1.3rem;border-radius:12px;border:2px solid var(--btn);background:var(--btn);color:var(--on-btn);font-weight:700;font-size:1.05rem;cursor:pointer;text-align:center}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:2.75rem;padding:.4rem 1rem;font-size:1rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:.5rem 0;min-height:2.75rem;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.bar{height:.7rem;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:999px;min-width:0}
.bar.thin{height:.4rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem}
.areas{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.area{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;padding:1rem 1.1rem}
.area+.area{border-top:1px solid var(--line)}
.area .grow{flex:1 1 14rem;min-width:0;display:flex;flex-direction:column;gap:.4rem}
.num{font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.75rem}
.tile{display:flex;flex-direction:column;gap:.2rem;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;cursor:pointer;min-height:4.5rem}
.tile b{font-size:1.05rem}
.tile span{color:var(--muted);font-size:.9rem}

/* question */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.15rem .7rem;font-size:.85rem;color:var(--muted)}
.chip.on{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
button.chip{cursor:pointer;min-height:2.5rem;padding:.3rem 1rem;font-size:.95rem}
h1.q{font-size:1.4rem;line-height:1.3;text-wrap:pretty}
.hy{font-family:"Noto Sans Armenian",var(--f-body);font-size:1.12rem;line-height:1.5;color:var(--ink);text-wrap:pretty;overflow-wrap:anywhere}
.hy.sm{font-size:.95rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:.7rem}
.opt{position:relative;display:flex;gap:.8rem;align-items:flex-start;padding:.95rem 1rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-height:3.5rem}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt:focus-within{outline:3px solid var(--sel);outline-offset:2px}
.box{flex:none;width:1.55rem;height:1.55rem;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-size:1.05rem;line-height:1;font-weight:700;color:var(--surface);margin-top:.05rem}
.txt{min-width:0;flex:1}
.txt em{display:block;font-style:normal;font-weight:700;font-size:.85rem;margin-top:.2rem}
.opt.on{border-color:var(--sel);background:var(--sel-bg)}
.opt.on .box{background:var(--sel);border-color:var(--sel)}
.opt.on .box::after{content:"✓"}
.opt.ok{border-color:var(--good);background:var(--good-bg);cursor:default}
.opt.ok .box{background:var(--good);border-color:var(--good)}
.opt.ok em{color:var(--good)}
.opt.miss{border-color:var(--good);border-style:dashed;cursor:default}
.opt.miss .box{border-color:var(--good);color:var(--good)}
.opt.miss .box::after{content:"✓"}
.opt.miss em{color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);cursor:default}
.opt.bad .box{background:var(--bad);border-color:var(--bad)}
.opt.bad .box::after{content:"✕"}
.opt.bad em{color:var(--bad)}
.opt.off{cursor:default}
.fb{border-radius:12px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.35rem;border:1px solid var(--line);background:var(--surface)}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.part{background:var(--note-bg)}
.fb b.t{font-size:1.15rem}
.note{background:var(--note-bg);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem}
.grid18{display:grid;grid-template-columns:repeat(9,1fr);gap:.4rem}
.grid18 button{min-height:2.6rem;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-variant-numeric:tabular-nums}
.grid18 button.done{background:var(--sel-bg);border-color:var(--sel)}
.grid18 button.cur{outline:3px solid var(--sel);outline-offset:1px}
@media (max-width:30rem){.grid18{grid-template-columns:repeat(6,1fr)}}

/* result */
.verdict{border-radius:14px;padding:1.3rem 1.2rem;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:.4rem}
.verdict.pass{border-color:var(--good);background:var(--good-bg)}
.verdict.fail{border-color:var(--bad);background:var(--bad-bg)}
.verdict .big{font-family:var(--f-disp);font-weight:600;font-size:1.9rem;line-height:1.15}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;white-space:nowrap}
tr.sum td{font-weight:700;border-bottom:0}
.state{font-weight:700}.state.g{color:var(--good)}.state.b{color:var(--bad)}

/* lists */
.qlist{display:flex;flex-direction:column;gap:.6rem}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.4rem}
.qitem .hd{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center;font-size:.85rem;color:var(--muted)}
.qitem ul{display:flex;flex-direction:column;gap:.15rem}
.qitem li{padding-left:1.4rem;position:relative}
.qitem li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700}
.qitem li.x::before{content:"✕";color:var(--bad)}
.qitem li.x{color:var(--muted)}
.field{width:100%;min-height:3rem;padding:.6rem .9rem;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.facts{display:grid;grid-template-columns:minmax(5.5rem,auto) 1fr;gap:.45rem 1rem}
.facts dt{font-weight:700;font-variant-numeric:tabular-nums}
.facts dd{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.facts dt{overflow-wrap:anywhere}
@media (max-width:26rem){.facts{grid-template-columns:1fr;gap:.1rem}.facts dd{margin-bottom:.6rem}}
.plain{display:flex;flex-direction:column;gap:.45rem}
.plain li{padding-left:1.1rem;position:relative}
.plain li::before{content:"";position:absolute;left:0;top:.62em;width:.4rem;height:.4rem;border-radius:50%;background:var(--muted)}
details.panel>summary{cursor:pointer;font-weight:700;min-height:2rem}
details.panel[open]>summary{margin-bottom:.9rem}
footer{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:.4rem}
footer a,.panel a{color:inherit}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s ease}}
</style>

const HY={};function hy(o){Object.assign(HY,o)}
add("g",[
[0,"Zu welchem Reich gehörte das Gebiet des heutigen Österreich ab Christi Geburt fast 500 Jahre lang?",["Römisches Reich","Osmanisches Reich","Persisches Reich","Russisches Reich"],"1000","Die Römerzeit begann um Christi Geburt und dauerte fast 500 Jahre."],
[0,"Wer lebte vor rund 2000 Jahren auf dem Gebiet des heutigen Österreich?",["Kelten","Römer","Wikinger","Mongolen"],"1100","Es gab keltische Königreiche. Sie wurden um Christi Geburt Teil des Römischen Reiches."],
[0,"Welcher Fluss war in der Römerzeit die Grenze des Römischen Reiches?",["Donau","Mur","Salzach","Drau"],"1000","Die Donau bildete damals die Grenze des Römischen Reiches."],

[0,"Welche Gruppen kamen nach dem Ende der Römerzeit in das Gebiet des heutigen Österreich?",["Slawen","Bajuwaren (Vorfahren der Bayern)","Alemannen","Wikinger"],"1110","Zuerst kamen Slawen, im Westen lebten Alemannen, ab etwa 600 kamen Bajuwaren. Ab etwa 900 lebten im Osten auch Ungarn."],
[0,"In welchem Jahr wurde der Name „Ostarrichi“ (Österreich) zum ersten Mal in einer Urkunde erwähnt?",["996","1273","1804","1918"],"1000","996 steht „Ostarrichi“ erstmals in der Urkunde eines deutschen Kaisers. Gemeint war eine Gegend im Westen von Niederösterreich."],
[0,"Welche Aussagen über die Römerzeit stimmen?",["Wien hieß „Vindobona“","Linz hieß „Lentia“","Carnuntum war die größte römische Siedlung","Graz hieß „Vindobona“"],"1110","Carnuntum hatte in seiner Blütezeit etwa 50.000 Einwohner."],
[0,"Warum wird in Österreich heute vorwiegend Deutsch gesprochen?",["Wegen der Zuwanderung der Alemannen und Bajuwaren","Wegen der Herrschaft der Römer","Wegen des Staatsvertrags von 1955","Wegen der Zuwanderung der Slawen"],"1000","Die Zuwanderung der Alemannen und Bajuwaren ist der wichtigste Grund."],

[1,"Wo lebte die Familie Habsburg ursprünglich?",["In der Schweiz","In Ungarn","In Spanien","In Böhmen"],"1000","Der alte Wohnsitz der Familie war die Habichtsburg in der Schweiz."],

[1,"Wie lange haben die Habsburger in Österreich regiert?",["Fast 650 Jahre","Etwa 100 Jahre","Etwa 300 Jahre","Mehr als 1000 Jahre"],"1000","Von 1273 bis 1918, also fast 650 Jahre."],
[1,"Welche Städte waren neben Wien Haupt- und Residenzstädte der Habsburger?",["Prag","Budapest","Pressburg (Bratislava)","Berlin"],"1110","Neben Wien waren es Prag, Budapest und Pressburg."],
[1,"Wie wurden die Habsburger ab etwa 1500 in Europa so mächtig?",["Durch erfolgreiche Heiratspolitik","Durch freie Wahlen","Durch den Marshall-Plan","Durch den Beitritt zur EU"],"1000","Bekannter Spruch: Andere mögen Kriege führen, Österreich heiratet."],
[1,"Welche Länder gewannen die Habsburger durch Hochzeiten?",["Spanien","Böhmen","Ungarn","Russland"],"1110","Auch die Niederlande und Belgien kamen durch Hochzeiten dazu."],

[1,"Ab wann wurde Salzburg von den Habsburgern regiert?",["Erst ab dem frühen 19. Jahrhundert","Ab 1273","Ab etwa 1500","Ab 1918"],"1000","Salzburg war bis 1803 ein eigenes geistliches Fürstentum."],
[1,"Wie hieß Deutschland vom Mittelalter bis zum Beginn des 19. Jahrhunderts? Auch das heutige Österreich gehörte dazu.",["Heiliges Römisches Reich Deutscher Nation","Ostmark","Österreich-Ungarn","Republik Deutsch-Österreich"],"1000","Habsburger waren auch deutsche Könige und römisch-deutsche Kaiser."],

hy({
g1:"Ո՞ր կայսրության կազմում էր ներկայիս Ավստրիայի տարածքը Քրիստոսի ծննդից սկսած գրեթե 500 տարի։",
g2:"Ովքե՞ր էին ապրում ներկայիս Ավստրիայի տարածքում մոտ 2000 տարի առաջ։",
g3:"Ո՞ր գետն էր հռոմեական ժամանակաշրջանում Հռոմեական կայսրության սահմանը։",

g5:"Ո՞ր խմբերն եկան ներկայիս Ավստրիայի տարածք հռոմեական ժամանակաշրջանի ավարտից հետո։",
g6:"Ո՞ր թվականին է «Ostarrichi» (Ավստրիա) անունն առաջին անգամ հիշատակվել փաստաթղթում։",

g8:"Ինչո՞ւ են այսօր Ավստրիայում հիմնականում գերմաներեն խոսում։",
g9:"Ավստրիայի փոքրամասնությունների մասին ո՞ր պնդումներն են ճիշտ։",
g10:"Ո՞ր անուններն ունեն սլավոնական ծագում։",

g12:"Ո՞ր թվականից սկսեցին Հաբսբուրգները կառավարել Ավստրիայում։",
g13:"Որքա՞ն ժամանակ են Հաբսբուրգները կառավարել Ավստրիայում։",
g14:"Վիեննայից բացի՝ ո՞ր քաղաքներն էին Հաբսբուրգների մայրաքաղաքներ և նստավայրեր։",
g15:"Ինչպե՞ս Հաբսբուրգները մոտ 1500 թվականից այդքան հզորացան Եվրոպայում։",
g16:"Ո՞ր երկրները Հաբսբուրգները ձեռք բերեցին ամուսնությունների միջոցով։",
g17:"Որտե՞ղ էին Հաբսբուրգներն իշխում սկզբում։",
g18:"Ե՞րբ սկսեցին Հաբսբուրգները կառավարել Զալցբուրգը։",
g19:"Ինչպե՞ս էր կոչվում Գերմանիան միջնադարից մինչև 19-րդ դարի սկիզբը։ Ներկայիս Ավստրիան նույնպես դրա մաս էր։",
g20:"Ե՞րբ է հիմնադրվել «Ավստրիական կայսրությունը» (Kaiserreich Österreich)։",
g21:"Ինչպե՞ս էր կոչվում Հաբսբուրգների պետությունը 1867-ից մինչև 1918 թվականը։",
g22:"Ներկայիս ո՞ր պետություններն են ժամանակին ամբողջությամբ կամ մասամբ եղել Ավստրիական կայսրության կազմում։",
g23:"Ներկայիս այս պետություններից որո՞նք են ժամանակին եղել Ավստրիական կայսրության կազմում։",
g24:"Ի՞նչ բարեփոխումներ են եղել Մարիա Թերեզայի օրոք։",
g25:"Ե՞րբ է կառավարել Մարիա Թերեզան։",
g26:"Ո՞ւմ են Մարիա Թերեզայի օրոք հավատքի պատճառով վտարել Ավստրիայից։",
g27:"Ի՞նչ տեղի ունեցավ 19-րդ դարի «արդյունաբերական հեղափոխության» ժամանակ։",
g28:"Արդյունաբերության ո՞ր ճյուղերն էին հատկապես կարևոր 19-րդ դարում։",
g29:"Ի՞նչ է նշանակում «բացարձակ իշխանություն» (absolute Herrschaft)։",

g58:"Ի՞նչ է նշանակում, երբ կառավարությունը կառավարում է «ավտորիտար» կերպով։",

let cloudRef=null,cloudState="check",cloudKind="claude",pushing=false,dirty=false,pushTimer=null,pushFails=0,initTries=0;
const FATAL=["invalid_argument","revoked","not_granted","capability_disabled","capability_removed","transform_error","quota_exceeded"];
function saveNote(){
  if(cloudKind==="gh"){
    if(cloudState==="ok")return `<span class="state g">Online gesichert.</span> Der Fortschritt bleibt erhalten, auch mit einem anderen Handy oder Browser.`;
    if(cloudState==="check"||cloudState==="ready")return `Online-Sicherung wird geprüft …`;
    return `<span class="state b">Online-Sicherung gerade nicht möglich.</span> Der Fortschritt ist vorerst nur auf diesem Gerät gespeichert und wird beim nächsten Öffnen mit Internet nachgetragen.`;
  }
  if(cloudState==="ok")return `<span class="state g">Im Claude-Konto gesichert.</span> Der Fortschritt bleibt erhalten, auch auf einem anderen Gerät mit demselben Konto.`;
  if(cloudState==="ready")return `Claude-Konto erkannt. Die Sicherung im Konto startet mit der nächsten Antwort.`;
  if(cloudState==="check")return `Speicherung wird geprüft …`;
  return `<span class="state b">Nur auf diesem Gerät gespeichert.</span> Immer in diesem Browser üben und die Browserdaten nicht löschen.`;
}
function setCloud(st){cloudState=st;const el=document.getElementById("savenote");if(el)el.innerHTML=saveNote()}
function snapshotState(){return JSON.parse(JSON.stringify({p:S.p,days:S.days,exams:S.exams,date:S.date||"",big:!!S.big,hy:S.hy!==false,u:S.u||0,rst:S.rst||0}))}
function mergeRemote(r){
  let newer=false;const lr=S.rst||0,rr=+r.rst||0;
  if(rr>lr){S.p={};S.days={};S.exams=[];S.rst=rr}
  if(lr>rr)newer=true;
  else{
    const rp=r.p&&typeof r.p==="object"?r.p:{};
    for(const k in rp){if(!/^[gds]\d+$/.test(k))continue;const a=S.p[k],b=rp[k];if(b&&typeof b==="object"&&(!a||(+b.t||0)>(a.t||0)))S.p[k]={s:b.s|0,n:b.n|0,t:+b.t||0}}
    for(const k in S.p){const b=rp[k];if(!b||(S.p[k].t||0)>(+b.t||0))newer=true}
    const rd=r.days&&typeof r.days==="object"?r.days:{};
    for(const k in rd)if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(rd[k]|0)>(S.days[k]||0))S.days[k]=rd[k]|0;
    for(const k in S.days)if((S.days[k]||0)>(rd[k]|0))newer=true;
    const re=Array.isArray(r.exams)?r.exams.filter(x=>x&&typeof x==="object"):[];
    const seen=new Set(S.exams.map(x=>x.t)),rseen=new Set(re.map(x=>x.t));
    if(S.exams.some(x=>!rseen.has(x.t)))newer=true;
    re.forEach(x=>{if(!seen.has(x.t))S.exams.push({t:+x.t||0,g:+x.g||0,d:+x.d||0,s:+x.s||0,pass:!!x.pass})});
    S.exams.sort((a,b)=>a.t-b.t);S.exams=S.exams.slice(-10);
  }
  if((+r.u||0)>(S.u||0)){if(typeof r.date==="string")S.date=r.date;S.big=!!r.big;if(typeof r.hy==="boolean")S.hy=r.hy;S.u=+r.u}
  else if((S.u||0)>(+r.u||0))newer=true;
  return newer;
}
async function flush(){
  if(!cloudRef||pushing||!dirty)return;
  pushing=true;dirty=false;
  try{await cloudRef.set(snapshotState());pushFails=0;setCloud("ok")}
  catch(e){
    if(FATAL.includes(e&&e.code)||++pushFails>5){cloudRef=null;setCloud("local")}
    else dirty=true;
  }
  pushing=false;
  if(dirty&&cloudRef){clearTimeout(pushTimer);pushTimer=setTimeout(flush,4000)}
}
function queuePush(){if(!cloudRef)return;dirty=true;clearTimeout(pushTimer);pushTimer=setTimeout(flush,cloudKind==="gh"?3000:1200)}

function ghConfig(){
  const m=/^#sync=([\w.-]+\/[\w.-]+),([\w-]+)$/.exec(location.hash||"");
  if(m){try{localStorage.setItem(KEY+"-sync",m[1]+","+m[2])}catch(e){}return{repo:m[1],token:m[2]}}
  try{const v=localStorage.getItem(KEY+"-sync");if(v){const i=v.indexOf(",");if(i>0)return{repo:v.slice(0,i),token:v.slice(i+1)}}}catch(e){}
  return null;
}
function ghBackend(repo,token){
  const url="https://api.github.com/repos/"+repo+"/contents/progress.json";
  const H={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"};
  let sha=null;
  const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const dec=b=>JSON.parse(decodeURIComponent(escape(atob(String(b).replace(/\s/g,"")))));
  const denied=st=>st===401||st===403;
  async function get(){
    const r=await fetch(url+"?t="+Date.now(),{headers:H,cache:"no-store"});
    if(r.status===404){sha=null;return{exists:false,data:()=>null}}
    if(!r.ok)throw{code:denied(r.status)?"not_granted":"unavailable"};
    const j=await r.json();sha=j.sha;const d=dec(j.content);
    return{exists:true,data:()=>d};
  }
  function put(data){
    const body={message:"Lernfortschritt "+today(),content:enc(data)};if(sha)body.sha=sha;
    return fetch(url,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify(body),keepalive:true});
  }
  async function set(data){
    let r=await put(data);
    if(r.status===409||r.status===422){           // someone else wrote in between: merge, then write again
      const cur=await get();if(cur.exists){mergeRemote(cur.data());saveLocal()}
      r=await put(snapshotState());
    }
    if(denied(r.status)||r.status===404)throw{code:"not_granted"};
    if(!r.ok)throw{code:"unavailable"};
    const j=await r.json();sha=j.content&&j.content.sha||sha;
  }
  return{get,set};
}
async function initCloud(){
  try{
    let ref;const gh=ghConfig();
    if(gh){cloudKind="gh";ref=ghBackend(gh.repo,gh.token)}
    else{
      const c=window.claude;
      if(!c||typeof c.use!=="function"){setCloud("local");return}
      const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
      if(!db||!user){setCloud("local");return}
      const uid=await user.id();
      if(!uid){setCloud("local");return}
      ref=db.doc("data/users/"+uid+"/progress");
    }
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000))]);
    const remote=snap.exists?snap.data():null;
    const before=JSON.stringify(snapshotState());
    const newer=remote?mergeRemote(remote):(cloudKind==="gh"||Object.keys(S.p).length>0||S.exams.length>0);
    saveLocal();cloudRef=ref;
    setCloud(remote?"ok":"ready");
    if(newer){dirty=true;flush()}
    if(JSON.stringify(snapshotState())!==before&&view!=="quiz")render();
  }catch(e){
    setCloud("local");
    if(cloudKind==="gh"&&!FATAL.includes(e&&e.code)&&initTries++<20)setTimeout(initCloud,15000);
  }
}

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>(Math.round(n*100)/100).toLocaleString("de-AT",{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const P=id=>S.p[id]||{s:0,n:0};
const sits=q=>P(q.id).s>=2;
const isWrong=q=>{const p=P(q.id);return p.n>0&&p.s===0};
const byArea=a=>QS.filter(q=>q.a===a);
const pts1=n=>fmt(n)+(n===1?" Punkt":" Punkte");
function score(q,sel){
  let ok=0;const total=q.o.filter(o=>o.c).length;
  for(const i of sel){if(!q.o[i].c)return 0;ok++}
  return Math.round(ok/total*100)/100;
}
function record(q,full){
  const p=S.p[q.id]||(S.p[q.id]={s:0,n:0});
  p.n++;p.s=full?Math.min(p.s+1,3):0;p.t=Date.now();
  const d=today();S.days[d]=(S.days[d]||0)+1;save();
}
function daysLeft(){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(S.date||""))return null;
  const [y,m,d]=S.date.split("-").map(Number);
  const t=new Date(y,m-1,d),n=new Date();n.setHours(0,0,0,0);
  return Math.round((t-n)/864e5);
}
function label(q){
  if(q.a==="s")return q.num?"Offizielle Frage Nr. "+q.num:"Zusatzwissen";
  return AREAS[q.a].ch[q.ch];
}
const hyP=(q,cls)=>S.hy!==false&&HY[q.id]?`<p class="hy${cls||""}" lang="hy">${esc(HY[q.id])}</p>`:"";
const correctList=q=>q.o.filter(o=>o.c).map(o=>"<li>"+esc(o.t)+"</li>").join("");

/* ---------- picking questions ---------- */
function pickLearn(a,n){
  if(!a){ // mixed: balanced over the three areas
    const per=Math.ceil(n/3);let out=[];
    ORDER.forEach(x=>{out=out.concat(pickLearn(x,per))});
    return rnd(out).slice(0,n);
  }
  const pool=byArea(a).map((q,i)=>({q,i,r:Math.random()}));
  const bucket=q=>{const p=P(q.id);if(p.n&&!p.s)return 0;if(!p.n)return 1;if(p.s===1)return 2;return 3};
  pool.sort((x,y)=>{
    const bx=bucket(x.q),by=bucket(y.q);
    if(bx!==by)return bx-by;
    if(bx===1)return x.i-y.i;            // new questions in chapter order
    if(bx===3)return (P(x.q.id).t||0)-(P(y.q.id).t||0); // longest not seen first
    return x.r-y.r;
  });
  return pool.slice(0,n).map(x=>x.q);
}
function pickExam(){
  const out=[];
  ["g","d"].forEach(a=>{out.push(...rnd(byArea(a)).slice(0,6))});
  const byNum={};byArea("s").forEach(q=>{if(q.num)(byNum[q.num]=byNum[q.num]||[]).push(q)});
  rnd(Object.keys(byNum)).slice(0,6).forEach(k=>out.push(rnd(byNum[k])[0]));
  return out;
}

function vFacts(){

}

    <li>mindestens <b>3 Punkten in jedem</b> der drei Gebiete</li>

  <div class="panel stack"><h2>Was dieser Trainer abdeckt</h2><ul class="plain">
    <li><b>Land Salzburg:</b> Das Land veröffentlicht eine Liste mit 52 Fragen. Alle 52 sind hier enthalten. Die Antwortmöglichkeiten sind nicht veröffentlicht und wurden aus der Lernunterlage abgeleitet.</li>
    <li><b>Geschichte und Demokratie:</b> Der Bund veröffentlicht nur Beispielfragen, keinen vollständigen Katalog. Die Fragen hier decken jedes Kapitel der Lernunterlage ab. Die genauen Formulierungen in der Prüfung können anders sein.</li>
    <li>Zusätzlich lohnt sich der offizielle Online-Übungstest auf <a href="https://www.staatsbuergerschaft.gv.at">staatsbuergerschaft.gv.at</a>.</li></ul></div>

/* ---------- render + events ---------- */
function render(){
  document.documentElement.classList.toggle("big",!!S.big);
  document.getElementById("homebtn").hidden=view==="home"||view==="quiz";
  app.innerHTML=({home:vHome,quiz:vQuiz,summary:vSummary,result:vResult,browse:vBrowse,facts:vFacts,info:vInfo}[view]||vHome)();
}
function finishExam(){
  const r={g:0,d:0,s:0,items:ses.items};
  ses.items.forEach(x=>{x.pts=score(x.q,x.sel);r[x.q.a]+=x.pts;record(x.q,x.pts===1)});
  ORDER.forEach(a=>r[a]=Math.round(r[a]*100)/100);
  r.each=r.g>=3&&r.d>=3&&r.s>=3;
  r.pass=r.each||Math.round((r.g+r.d+r.s)*100)/100>=12;
  S.exams.push({t:Date.now(),g:r.g,d:r.d,s:r.s,pass:r.pass});S.exams=S.exams.slice(-10);save();
  res=r;ses=null;go("result");
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act;
  if(act==="home"){ses=null;confirmReset=false;go("home")}
  else if(act==="go")go(b.dataset.v);
  else if(act==="learn")startLearn(b.dataset.a||null);
  else if(act==="wrong")startLearn(null,rnd(QS.filter(isWrong)).slice(0,10));
  else if(act==="exam")startExam();
  else if(act==="examwrong")startLearn(null,res.items.filter(x=>x.pts<1).map(x=>x.q));
  else if(act==="quit"){ses=null;go("home")}
  else if(act==="check"){
    const it=ses.items[ses.i];if(!it.sel.size)return;
    it.pts=score(it.q,it.sel);it.done=true;const full=it.pts===1;
    record(it.q,full);
    if(!it.rep){if(full)ses.right++;else{ses.missed.push(it.q);const again=mk(it.q);again.rep=true;ses.items.push(again)}}
    render();
    const fb=app.querySelector(".fb");if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  else if(act==="next"){
    if(ses.i<ses.items.length-1){ses.i++;go("quiz")}
    else if(ses.mode==="learn"){sum={right:ses.right,first:ses.first,missed:ses.missed,a:ses.a};ses=null;go("summary")}
  }
  else if(act==="prev"){if(ses.i>0){ses.i--;go("quiz")}}
  else if(act==="jump"){ses.i=+b.dataset.n;go("quiz")}
  else if(act==="submit"){
    const open=ses.items.filter(x=>!x.sel.size).length;
    if(open&&!ses.warned){ses.warned=true;ses.i=ses.items.length-1;go("quiz")}else finishExam();
  }
  else if(act==="barea"){browse.a=b.dataset.a;render()}
  else if(act==="reset1"){confirmReset=true;render();const d=app.querySelector("details.panel:last-of-type");if(d)d.open=true}
  else if(act==="reset0"){confirmReset=false;render()}
  else if(act==="reset2"){S.p={};S.days={};S.exams=[];S.rst=Date.now();confirmReset=false;save();go("home")}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.matches(".opt input")&&ses){
    const it=ses.items[ses.i],i=+t.dataset.i;
    if(it.done&&ses.mode==="learn")return;
    if(t.checked)it.sel.add(i);else it.sel.delete(i);
    t.closest(".opt").classList.toggle("on",t.checked);
    const cb=document.getElementById("checkbtn");if(cb)cb.disabled=!it.sel.size;
    const g=app.querySelector(".grid18 .cur");if(g)g.classList.toggle("done",it.sel.size>0);
  }
  else if(t.id==="examdate"){S.date=t.value;S.u=Date.now();save();render();const d=app.querySelector("details.panel");if(d)d.open=true}
  else if(t.id==="hytoggle"){S.hy=t.checked;S.u=Date.now();save()}
  else if(t.id==="bigtype"){S.big=t.checked;S.u=Date.now();save();document.documentElement.classList.toggle("big",S.big)}
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="suche"){browse.t=ev.target.value;const l=document.getElementById("blist");if(l)l.innerHTML=browseList()}
});
render();
initCloud();
